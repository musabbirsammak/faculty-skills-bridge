# Optional: a local MySQL server. Run `docker compose up -d`, then use the defaults in .env.example.
services:
  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: skills_bridge
      MYSQL_USER: skills_bridge
      MYSQL_PASSWORD: skills_bridge
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
