{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Reset your password</h1><p>Enter your email address and we'll send you a link to choose a new password.</p></div></div>
<form method="post" class="form-card">
  {% csrf_token %}
  {% include "partials/form_fields.html" %}
  <div class="row"><button class="btn btn-primary" type="submit">Send reset link</button></div>
</form>
{% endblock %}
